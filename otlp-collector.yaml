receivers:
  otlp:
    protocols:
      grpc:
      http:
  zipkin: {}
processors:
  attributes:
    actions:
    - action: insert
      key: k8s_cluster_name
      value: k3s-demo
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 80
  batch:
    timeout: 10s
    send_batch_size: 1000
    send_batch_max_size: 1100
exporters:
  otlphttp/logs:
    logs_endpoint: http://loki.telemetry.svc:80/api/v1/push
  otlphttp/metrics:
    metrics_endpoint: http://mimir-nginx.telemetry.svc:80/prometheus/api/v1/push
  otlphttp/traces:
    traces_endpoint: http://tempo.telemetry.svc:4317
service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch, attributes]
      exporters: [otlphttp/logs]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch, attributes]
      exporters: [otlphttp/metrics]
    traces:
      receivers: [otlp, zipkin]
      processors: [memory_limiter, batch, attributes]
      exporters: [otlphttp/traces]
