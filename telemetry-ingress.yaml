apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: mimir
spec:
  hosts:
  - "mimir.${EXTERNAL_DOMAIN}"
  gateways:
  - istio-system/istio-system
  http:
  - name: mimir
    match:
    - port: 80
    route:
    - destination:
        port:
          number: 80
        host: mimir-nginx
---
